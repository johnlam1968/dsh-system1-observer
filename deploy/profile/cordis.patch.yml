#     - id: session-factory
#       name: ./session-factory/tool.js

# harness_RSI: forced reconcile marker 2026-10-09 (module edits: peer-bridge read gate, session-factory prompt signal)
# harness_RSI: reconcile 2026-10-09 18:45 — peer-bridge's three tool registrations are now wrapped in ONE
# `ctx.effect`, so the names are UNREGISTERED on unload. Before this a bare `ctx.tools.register` left them
# registered and a reload's `apply` was refused by its own leftovers ("duplicates within one layer").
# Checked before writing: `node --check` parses; the port's drift check reports the expected new live hash
# (c54f21dc) rather than the stale pin, which is the smoke seeing the intended edit and not a surprise.
# harness_RSI: reconcile 2026-10-09 18:46 — session-factory's single `session_create` registration is wrapped the
# same way. BOTH live rows are now wrapped, and each was verified by a mock-context test that asserts the
# counterfactual: FIXED → dispose leaves (none) and a reload is ACCEPTED; OLD (bare) → dispose leaves the tool
# registered and the reload is REFUSED with "duplicates within one layer". The old shape was tested from a temp
# copy beside the row, so the comparison is the same harness on the same module.
# harness_RSI: reconcile 2026-10-09 — peer-bridge's delivered message now carries an HONEST SOURCE:
# `{ kind: 'agent-message', form: 'relay', senderSessionId: me.id }` instead of `{ kind: 'user' }`. Before it, a
# peer-sent nudge was attributed to the OPERATOR, so "was this the operator?" was unanswerable at the source; this
# is the exact shape the harness's own producer builds (`agentMessageSource`, `dsh-subagent:571-576`) and its strict
# triple is what the v2->v3 migration's `assertSource` requires. VERIFIED against the real write gate
# (`adoptSessionEvent`, SESSION_FORMAT_VERSION 4): the new source is ACCEPTED, and an empty kind is the only refusal.
