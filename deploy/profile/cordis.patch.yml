# DocDrift's app profile: the profile's own layer, applied after every bundle layer.
#
# Why a PROFILE is the thing an end user installs, and not the bundle: the Web UI is
# @deepseek-ai/dsh-web-app, a 562-line bundle with five preset patch files of its own. A bundle
# brings ROWS; only a profile chooses which bundles compose it. So the capability travels as
# `@local/dsh-docdrift` and the APP is this directory.

# ── WHERE THE SETTINGS LIVE ─────────────────────────────────────────────────────────────────────
#
# DocDrift's gates are the `config` of its `docdrift` row, and a patch row REPLACES the whole config
# for its id -- it never merges. So to change one value, restate the ones you care about and let the
# rest fall back to the measured defaults in the bundle.
#
# Nothing is required here: the bundle ships the defaults (`config: {}`), and the Web UI's
# Plugins page writes whatever you change on the card straight into THIS file. To set something
# before the UI is used, add the row yourself:
#
# - id: docdrift
#   name: '@local/dsh-docdrift'
#   config:
#     mode: enforce              # enforce holds a draft back; observe judges it and delivers anyway
#     allowTools: true           # keep a session to its four DocDrift tools
#     prompt: true               # tell the session it is a plant maintenance assistant (YAML-only)
#     restatesEnabled: true      # and *At is how sure the judge must be before it blocks the draft
#     restatesAt: 0.55
#     inventedContextEnabled: true
#     inventedContextAt: 0.55
#     relationEnabled: true
#     relationAt: 0.6
#     rightMachineEnabled: true
#     rightMachineAt: 0.85
#     groundedEnabled: true
#     groundedAt: 0.8
#     severityEnabled: true
#
# Every field sits at the ROOT on purpose: the settings card renders the fields the form puts at its
# root, so a nested field is returned by the service and drawn by nothing.
#
# A value NOT named here is not "off" -- it is the schema default, which is what the card shows.

# The port this profile's web app listens on. A deployment decision: a terminal needs none.
#
# host 127.0.0.1 (was 0.0.0.0 from 2026-10-12 until 2026-10-14). The webserver schema
# permits exactly two literals -- "127.0.0.1" and "0.0.0.0" -- and this layer is applied
# after the bundle layer, so the bind is honoured. The web app's own `--host 0.0.0.0`
# FLAG is refused by design (dsh-web-app/lib/startup.js), so this composition row is
# the only route to a LAN bind.
#
# WHY IT WENT BACK TO LOOPBACK (2026-10-14). While host was 0.0.0.0 this GUI answered the
# whole LAN, and anyone who reached it could DRIVE THE AGENT -- which runs commands on
# this machine. The only barrier was the launch token in the URL, which is not a security
# boundary. dsh-relay now sits in front of the loopback bind and terminates TLS plus
# password authentication, which is the layer that was missing. dsh-relay REFUSES TO START
# in front of a harness already bound to 0.0.0.0, so this row and that bundle are mutually
# dependent: change one and the other stops working.
#
# Consequence: the plain-HTTP LAN URL is gone; reach the GUI at https://<lan-ip>:3443.
# That also removes the secure-context problem, because over HTTPS the browser exposes
# both navigator.mediaDevices (voice input) and crypto.randomUUID (which mints every RPC
# id) -- neither exists on an http:// LAN origin.
#
# Rollback: set host back to 0.0.0.0 AND disable the `relay` row, or dsh-relay refuses to
# start. Then restart dsh@docdrift.
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: 127.0.0.1
    port: 3090

# The skills catalogue. `skill-filesystem` is the PROVIDER that fills it; the catalogue arrives as
# a USER MESSAGE, measured at ~350 tokens of instruction irrelevant to a maintenance answer, on a
# 7B model whose documented weakness is that accuracy falls as state grows. The `skill` REGISTRY
# stays enabled: removing it removes the `skills` SERVICE, every row injecting it sits PENDING for
# ever, and a new session fails with "waiting for skill". That has happened once.
- id: skill-filesystem
  disabled: true
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
# ── THE MODEL, AND WHY THIS FILE NO LONGER NAMES IT ──────────────────────────────────────────────
#
# This profile used to replace `llm-pi-ai` wholesale with a four-model Ollama map. That override is
# GONE (2026-09-29) so the bundle's own default applies: OpenRouter, `mistralai/ministral-3b-2512`,
# keyed by OPENROUTER_API_KEY. `providers` is replaced wholesale and not merged, so leaving the old
# block here would have kept the profile on Ollama no matter what the bundle declared -- which is
# exactly what it did. The bundle keeps an `ollama` route declared as well; a deployment that wants
# the no-egress route sets `provider: ollama, model: qwen2.5:7b` on `agent-default-model` instead.


# ── THE JUDGE: JEV OVER OPENROUTER ──────────────────────────────────────────────────────────────
#
# `dsh-system1` is in this profile's bundles (see package.json), so its bundle has inserted the
# `system1` and `system1-typesafe` rows and these two rows OVERRIDE them. They must be here rather
# than in the DocDrift bundle: a bundle patch that named these ids before dsh-system1 was in the
# bundle list would target rows that do not exist yet, and the Loader warns and SKIPS it.
#
# `baseURL` is `https://openrouter.ai/api` and not the package default, because the adapter appends
# a FIXED `/v1/systemone`: OpenRouter serves that contract (200, typesafe/jev-1.13-20260917, 0.55 s),
# where `https://api.typesafe.ai` answers 401 to an OpenRouter key. Measured 2026-09-28.
#
# `apiKeyEnv` NAMES A VARIABLE, so no key is written here. Both TYPESAFE_API_KEY and
# OPENROUTER_API_KEY hold the same OpenRouter key in this environment; this profile names the one
# that says what it is. The judge is a HOSTED THIRD PARTY: every draft judged leaves this machine.
- id: system1
  name: dsh-system1
  config:
    defaultModel:
      provider: typesafe
      model: jev-latest
    timeoutMs: 20000

- id: system1-typesafe
  name: dsh-system1/providers/typesafe
  config:
    id: typesafe
    apiKeyEnv: OPENROUTER_API_KEY
    baseURL: https://openrouter.ai/api
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openrouter:
        models:
          - id: meta-llama/llama-3.1-8b-instruct
            name: "Meta: Llama 3.1 8B Instruct"
            contextWindow: 131072
            maxTokens: 117964
            input:
              - text
          - id: mistralai/ministral-3b-2512
            name: "Mistral: Ministral 3 3B 2512"
            contextWindow: 131072
            maxTokens: 104857
            input:
              - text
              - image
          - id: mistralai/ministral-8b-2512
            name: "Mistral: Ministral 3 8B 2512"
            contextWindow: 262144
            maxTokens: 209715
            input:
              - text
              - image
          - id: qwen/qwen-2.5-7b-instruct
            name: "Qwen: Qwen2.5 7B Instruct"
            contextWindow: 32768
            maxTokens: 29491
            input:
              - text
          - id: qwen/qwen3-8b
            name: "Qwen: Qwen3 8B"
            contextWindow: 131072
            maxTokens: 8192
            input:
              - text
      minimax-cn:
        models:
          # ── M3.1-Flash-Preview added 2026-10-13 ──
          #
          # VERIFIED EMPIRICALLY against the live endpoint on 2026-10-13 (credential resolved from the
          # running dsh process; value never printed). Four probes, base64 payloads, raw responses:
          #
          #   host       probe                          result
          #   ---------  -----------------------------  ---------------------------------------------
          #   .com       text control                   HTTP 200  "OK"
          #   .io        text control                   HTTP 401  "invalid api key"   <-- REJECTED
          #   .com       video (mp4, video+audio)       HTTP 200  "bright blue ... FRAME 85 in yellow"
          #   .com       image (png)                    HTTP 200  "Red" (+ thinking block)
          #   .com       audio-only (m4a)               HTTP 400  "unsupported content type 'audio' (2013)"
          #
          # CONSEQUENCE 1 — HOST. `api.minimax.io` is REJECTED for this credential; `api.minimaxi.com` is
          # correct. The public doc's `ANTHROPIC_BASE_URL=https://api.minimax.io/anthropic` snippet
          # describes the international/M-Plan surface, which this CN key is not entitled to. An earlier
          # revision of this row set `baseURL: https://api.minimax.io/anthropic` per that snippet and was
          # WRONG — removed 2026-10-13 after the 401. No `baseURL` is set now, so the model inherits the
          # bundled minimax-cn provider baseUrl `https://api.minimaxi.com/anthropic`.
          #
          # CONSEQUENCE 2 — AUDIO. There is NO audio content block. The Anthropic-compatible surface
          # accepts only `text`, `image`, `video`, `tool_use`, `tool_result`, `thinking`; `type: "audio"`
          # is refused with error 2013. A video file MAY carry an audio track and is accepted as a
          # `video` block, but audio-to-text is a SEPARATE endpoint (`/v1/speech_to_text`), which this
          # deployment already wires for dsh-telegram (`sttProvider: minimax`,
          # `sttBaseUrl: https://api.minimaxi.com/v1`). It is not reachable through the model route.
          #
          # CONSEQUENCE 3 — VIDEO IS NOT CONFIGURABLE HERE. The model accepts video, but
          # `dsh-llm-pi-ai`'s MODALITIES vocabulary is exactly `{ text, image }`
          # (lib/index.js:280 `const MODALITIES = Object.keys({ text: true, image: true })`), so
          # `input: [text, image, video]` is refused by the settings schema exactly the way
          # `reasoningEfforts.minimal: null` was. The row advertises `text, image`; video is reachable
          # only by calling the endpoint directly, as above.
          #
          # Specs per https://platform.minimax.io/docs/api-reference/text-anthropic-api and the
          # canonical record sst/models.dev `models/minimax/MiniMax-M1-Flash-Preview.toml`, which gives
          # `context = 1_000_000`, `output = 512_000`, `modalities.input = [text, image, video]`.
          #
          # THINKING IS FORCED ON. Per the doc's "Thinking Control" table, `thinking: {type:"disabled"}`
          # returns 400, and `output_config.effort` accepts EXACTLY `low|medium|high|xhigh|max`
          # (default `max`; `none` returns 400). The five-level map below is the complete set and the
          # `off` slot is deliberately absent so the picker cannot emit a disabled-thinking request.
          - id: MiniMax-M3.1-Flash-Preview
            name: "MiniMax-M3.1 Flash Preview"
            contextWindow: 1000000
            maxTokens: 512000
            input: [ text, image ]
            cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          # The three entries below are VERBATIM copies of the bundled catalog
          # (@earendil-works/pi-ai/dist/providers/data/minimax-cn.json, v0.85.1). They are listed because
          # `models:` REPLACES the served catalog rather than merging with it (resolveRouteModels in
          # dsh-llm-pi-ai/lib/types/catalog.js), so omitting any of them would silently drop the model
          # from the picker. Whenever pi-ai's bundled catalog is updated, re-copy below to match.
          - id: MiniMax-M3
            name: MiniMax-M3
            contextWindow: 1048576
            maxTokens: 512000
            input: [ text, image ]
            cost: { input: 0.3, output: 1.2, cacheRead: 0.06, cacheWrite: 0 }
          - id: MiniMax-M2.7
            name: MiniMax-M2.7
            contextWindow: 204800
            maxTokens: 131072
            input: [ text ]
            cost: { input: 0.3, output: 1.2, cacheRead: 0.06, cacheWrite: 0.375 }
          - id: MiniMax-M2.7-highspeed
            name: MiniMax-M2.7-highspeed
            contextWindow: 204800
            maxTokens: 131072
            input: [ text ]
            cost: { input: 0.6, output: 2.4, cacheRead: 0.06, cacheWrite: 0.375 }
      # The block above REPLACES the previously-empty `minimax-cn: {}`. A provider that is NOT named here
      # does not exist as far as this profile is concerned, however many models the installed catalog
      # carries for it — this `providers` map is replaced wholesale rather than merged, so an omission
      # is a silent removal, not a fallback.
      #
      # cerebras was added 2026-10-10, after its credential reached the systemd layer
      # (`dsh@.service.d/10-provider-keys.conf`): a declared provider with no key is selectable and
      # then fails the turn with `Provider is not configured`, which is worse than absent. Declare a
      # provider here only once its key is in the launcher's environment.
      #
      # fireworks was declared the same day and REMOVED again on the operator's instruction: the
      # account is out of credit, so its twenty catalog models would be selectable and then fail on
      # billing — visible-but-broken is exactly the state this comment exists to prevent. Re-add a
      # single `fireworks: {}` line here when the account is funded again. Its key is still in the
      # drop-in, which is inert while nothing here names the provider.
      cerebras: {}
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: minimax-cn
    model: MiniMax-M3.1-Flash-Preview
- id: system1-laya
  disabled: true
- id: system1-observer
  name: dsh-system1-observer
  config:
    hooks:
      - assemble
      - admit
      - draft
      - pre_execute
      - execute
      - post_execute
      - result
    provider: typesafe
    model: jev-latest
    timeoutMs: 8000
    turnEveryNTurns: 0
    questionSetsDir: /home/john/CodingProjects/dsh-system1-observer/criteria
    questionSet: session@1
    callsEnabled: true
    seamEnabled:
      assemble: false
      admit: false
      request: false
      draft: false
      pre_execute: false
      execute: false
      post_execute: false
      result: false
      close: false
    sessions:
      - id: session-30500a5a-c2da-4420-8087-e46356490ac9
        title: Optimizing greeting responses with AI coding help
    subjectSource: stored
    composeMaxChars: 8000
    observeSubagents: false
  disabled: false

# peer-bridge -- reach a SIBLING ROOT session. Promoted 2026-09-30 from the sandbox body kept at
# ~/.dsh/plugins/peer-bridge.dynamic-host.js (that file is the origin record of what the sandbox ran; this row is
# what runs now). The module lives beside this file because `@deepseek-ai/dsh-tools` resolves from the profile's
# parent node_modules and NOT from ~/.dsh/plugins.
#
# INSERTED, not named: an entry with an `id` and no `insert` overrides an EXISTING row, and a target that matches
# nothing is a warning on stderr -- the profile still boots and looks healthy. Measured, in the README.
#
# Send guard widened from one cwd substring to an allowlist, and made tunable by environment:
#   PEER_BRIDGE_SEND_MARKS=dsh-telegram,dsh-system1-observer
#   PEER_BRIDGE_READ_MARKS=docdrift,dsh-system1-observer
# See the module header for what this does and does not authorize.
- insert:
    - id: peer-bridge
      name: ./peer-bridge/index.js
      # DISABLED 2026-10-09 during the migration to the `dsh-harness-rsi` plugin. The bundle's `peer`
      # row is this row's PORT and registers the SAME tool names, so both cannot mount: a duplicate tool
      # name is a loud load failure. This row is kept in place rather than deleted so the rollback is one
      # `disabled: false` — but note the bundle also replaces `session-factory`, so the rollback is the
      # whole `/tmp/cordis.patch.yml.pre-migration-*` backup, not this line alone.
      disabled: true

# NOTE: this bundle is DISABLED below. The observer now ships its own `system1_decide`, over the same
# `decide` path it records, and takes the input shape its own set files are written in.
#
# system1-bridge -- the agent-facing `system1_decide` tool, with this profile's default backend.
#
# The bundle's own tool row defaults to `provider: laya-decide`, whose baseURL is http://127.0.0.1:8766 -- NOT
# running on this box (measured: HTTP 000), and `system1-laya` is disabled here for the same reason. The working
# backend is the `typesafe` provider above. A patch row REPLACES the whole config for its id rather than
# deep-merging, so both fields are restated.
#
# `typesafe` reaches Jev through OpenRouter (see the note on the `system1-typesafe` row): every judged draft
# leaves this machine. The tool itself decides nothing -- it returns probabilities.
#
# TWO HANDINESS FIXES IN THE BUNDLE, both found by using the tool rather than reading it:
#   * `questions` was declared as untyped JSON while the tool requires an OBJECT, so the first call sent a JSON
#     string and was refused. It is now `type: object`.
#   * the parameter descriptions hardcoded the bundle's own defaults (`laya-decide` / `auto`), so this profile's
#     override left the tool describing a backend it would not reach. They now name the configured default.
# Editing this file is also what makes the loader re-import the bundle's source.
#
# peer-bridge now puts the SENDER'S SESSION ID and a reply instruction into every delivered message. Before that,
# a receiver could only answer if the sender happened to write its own id into the free-text label -- measured when
# a delegated task reported into its own session instead of back to the caller.
- id: system1-bridge-tool
  config:
    provider: typesafe
    model: jev-latest
  disabled: true

# THE PROMPT REMINDERS, EVERY REQUEST. The Web editor writes its preset edits here by row id, and this is the same
# shape: the override REPLACES `preset-cordis`'s whole `config` -- Cordis patches replace config wholesale and never
# deep-merge -- so the shipped `plugins` list is restated verbatim from
#   @deepseek-ai/dsh/dsh-web-app/presets/cordis.patch.yml
# with two lines added to the persona prefix. AN UPGRADE THAT CHANGES THE SHIPPED PRESET WILL NOT REACH SESSIONS
# USING THIS OVERRIDE: diff the two files after any dsh upgrade.
- id: preset-cordis
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: cordis
    order: 4
    plugins:
      # Same persona as `standard`: tool descriptions and the skill catalog carry
      # the operating detail, and the skills own the preset-authoring rules.
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          suffix: Your working directory is {{cwd}}.
          prefix: >-
            You are a coding agent powered by the {{model}} model.  (1)
            Challenge the request with meta-questions: intent, necessity (do we
            need to write any codes to realize the intents), form (shall it be a
            dsh plugin or other forms, such as mcp server?), etc. (2) When a dev
            project is emerging, use sp- skills (supowerpowers) workflow from
            the beginning. (2) Do not re-invent the wheel: use tools to find
            existing 3rd-party dsh plugins, before design and write one. If
            there are some, review and learn from them, when coding a new one or
            fork existing one. (3) When coding is necessary, insist on top down
            design when architecture is not decided yet. Brainstorm the shape,
            features and ask user questions.  (4) When coding a dsh plugin,
            iteratvely parse all skills and tools related to dsh and plugins
            authoring. Read the dsh and plugin docs. (5) Also read the docs of
            any other application that the code need to use. When docs are not
            available, read the source code (if source code is on the host, git
            clone it). (6) When using shorthand to talk to **human** about L0,
            L1 etc, always denote it with longhand form. (7) No reporting talk
            show, in either direction across agent boundaries: the finished
            result is the deliverable, so put results in FILES and keep messages
            for decisions you cannot make and blockers that stop progress; never
            reply to acknowledge, confirm receipt, or narrate progress; and do
            not send interim reports between steps.            
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
              backgroundMode: continuable
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable
          - id: tool-subagent-codex
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: codex
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: claude-code
              toolName: subagent_claude_code
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            disabled: true
            config:
              subagentProvider: spawn
              maxRounds: 64
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: tool-cordis
        name: '@deepseek-ai/dsh-tool-cordis'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          customSkillDirs:
            - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')),
              'skills')
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: !!js "!ctx.get('profileContext')"

# FULL-TEXT SESSION SEARCH, ENABLED. `dsh-base` ships this row as `path: ':memory:'`, `openAt: never`, which is why
# `system1_sessions { action: 'search' }` refuses with "session search is disabled". A patch replaces `config`
# WHOLESALE, so both fields are restated here:
#   * a FILE path, not `:memory:`, so the derived index survives a restart instead of being rebuilt from the logs;
#   * `first-search`, so no startup is delayed -- the build is paid by the first search that needs it.
# ONE PROCESS OWNS AN INDEX PATH, so this file is this profile's alone; the other profiles keep `never`/`:memory:`.
#- id: session-query-sqlite
#  name: '@deepseek-ai/dsh-session-query-sqlite'
#  config:
#    path: !!js dshHomePath('session-query.db')
#    openAt: first-search

# ── dsh-telegram (DEVELOPMENT WIRING) ───────────────────────────────────────────────────────────
#
# The Telegram transport adapter, linked from /home/john/CodingProjects/dsh-telegram (see the
# `dsh-telegram` symlink in this profile's node_modules). Mounted as a PROFILE-layer row rather
# than a bundle, for two reasons:
#
#   1. It is under development, and this layer is WATCHED: `dsh-hmr` reconciles
#      `profile.patchPath` live (`reconcileProfilePatches`, dsh-app-boot), so a row added or
#      changed here mounts WITHOUT a restart. Adding the package to `dsh.profile.bundles`
#      instead changes the profile manifest, which is restart-scoped.
#   2. It keeps `dsh.profile.bundles` untouched. `dsh plugin add/remove` rewrites that list and
#      drops bundles it did not write, which is how this plugin disappeared from the `web`
#      profile once already.
#
# The durable, distributable form is a bundle: list the package in `dsh.profile.bundles` and let
# its own `dsh.bundle.patch` carry the config, so nothing is duplicated. This row is deliberately
# MINIMAL — only the two values that cannot come from the package's own defaults are restated,
# because the profile layer does not read a package's bundle patch. Everything else (sttBaseUrl,
# sttLang, ttsProvider, ttsVoice, pollTimeoutSeconds, …) falls back to the schema defaults in
# src/config.ts, and the STT/TTS keys fall back to OPENAI_API_KEY / MINIMAX_CN_API_KEY from the
# launch environment (src/voice/stt.ts, src/voice/tts.ts).
#
# Mounted disabled when DSH_TELEGRAM_BOT_TOKEN is empty: `apply` warns and returns before it
# installs anything.
- insert:
    - id: dsh-telegram
      name: dsh-telegram
      config:
        botToken: !!js process.env.DSH_TELEGRAM_BOT_TOKEN ?? ''
        allowedUserIds: !!js (process.env.DSH_TELEGRAM_ALLOWED_USER_IDS ??
          '').split(',').map(s => Number(s.trim())).filter(n =>
          Number.isFinite(n))
        # Who may run a /command, as distinct from who may chat. Empty refuses EVERY command,
        # including /help — fail-closed by design, and the reason a chat bound to an unrecoverable
        # session had no in-chat way out (`/new` was refused). Same env var as the chat allow-list.
        commandUserIds: !!js (process.env.DSH_TELEGRAM_ALLOWED_USER_IDS ??
          '').split(',').map(s => Number(s.trim())).filter(n =>
          Number.isFinite(n))
        # The model route, restated from THIS profile's own `agent-default-model` row below.
        #
        # Why it is pinned here at all: the persona prefix interpolates `{{model}}`, and
        # dsh-agent-loop resolves that variable as `agent.options.model` — it does NOT consult
        # `agent-default-model`. Only entry points (dsh-api-session-controller, dsh-headless,
        # dsh-webhook) call currentSelection() before creating; `ctx.agents.create` does not.
        # So a row that names no route makes every turn die with
        #   prompt variable "{{model}}" has no value for this assembly
        # while the row still reads `active` and the poll loop keeps running.
        #
        # The plugin can now resolve this itself (ctx.get('agentDefaultModel')), which is the
        # profile-independent path and the reason the package's own patch names no provider.
        # These two lines are belt-and-braces for the module the RUNNING process currently
        # holds: HMR reloads a changed plugin module, but that is not observable from here and
        # the failure it would cause is silent. Drop them once a restart has been confirmed to
        # load the current lib/index.js.
        provider: deepseek-official
        model: deepseek-flash
        # ── THIS DEPLOYMENT'S VOICE VALUES ──────────────────────────────────────────────────────
        #
        # The plugin's own defaults for these are deliberately neutral (OpenAI's endpoint, no
        # language hint, the provider's built-in voice), because a shipped default must not be one
        # operator's machine — `docs/PUBLISHING.md` B5. These lines are where this deployment says
        # what it actually is, and they are the ONLY reason the voice pipeline keeps working after
        # that change.
        #
        #   whisper  STT provider label — the wire shape is OpenAI-compat `/v1/audio/transcriptions`.
        #            The SenseVoice server at :18765 speaks that shape, so the existing `whisper`
        #            dispatch in src/voice/stt.ts works with no plugin source changes. (We previously
        #            ran the local voice_proxy on :8081 here, and MiniMax on api.minimaxi.com
        #            before that; all three share the same multipart upload contract.)
        #   sensevoice  The actual STT backend — a local FunASR SenseVoiceSmall process owned by
        #            ~/.config/systemd/user/sensevoice-server.service (project at
        #            ~/CodingProjects/sensevoice-server/). First-start download is ~1 GB; warm
        #            starts ~30s. Service restart, not dsh restart, after a model upgrade.
        #   asr-1.0  STT model. Empty here so `callWhisper` sends `whisper-1` — the SenseVoice
        #            server ignores the field and uses `FUNASR_MODEL` env to pick the real model.
        #            Naming an explicit id here would also be a no-op for SenseVoice; keep empty.
        #   yue      the spoken language here, so the endpoint is told rather than asked to detect.
        #            SenseVoice accepts `yue` (Cantonese) directly; the FunASR env sets the same
        #            default so an absent multipart field still routes to Cantonese.
        #   Cantonese_CuteGirl   the MiniMax system voice this deployment uses for outbound TTS
        #
        # All four STT knobs and ttsVoice are `.volatile()`, so a change here is read on the next
        # message. The host has to be able to reach :18765 — the sensevoice-server unit is what
        # owns that port; it does not need to be running before dsh@docdrift, only before the
        # first inbound voice note that targets it.
        sttProvider: whisper
        sttBaseUrl: http://127.0.0.1:18765/v1
        sttLang: yue
        ttsVoice: Cantonese_CuteGirl
        # The four shaping knobs below were CODE CONSTANTS in the plugin until 2026-10-08 — the
        # shipped `MINIMAX_BODY` carried speed 0.95, emotion 'happy', language_boost 'Chinese,Yue'
        # and modify_timbre 10. That made this deployment's ear the plugin's default, so they are
        # row config now and the plugin ships neutral values instead. These four lines are what
        # keeps the voice EXACTLY as it sounded; `tests/unit/tts.golden.test.ts` pins the body they
        # reproduce. All four are `.volatile()`, so a change is heard on the next spoken reply.
        ttsSpeed: 0.95
        ttsEmotion: happy
        ttsLanguageBoost: Chinese,Yue
        ttsModifyTimbre: 10
        # The command `/restart` runs, detached, to restart THIS profile. The plugin names no profile
        # of its own, so the deployment supplies it; the unit is dsh@.service (see the repo's deploy/).
        # The restart kills the process that answers, so the reply is sent first and the command is
        # delayed by two seconds.
        restartCommand: systemctl --user restart dsh@docdrift
- id: dsh-telegram
  disabled: false

# ── telemetry DISABLE (override of base bundle) ─────────────────────────────────────────────────
# The base bundle (@deepseek-ai/dsh-base) ships @deepseek-ai/dsh-session-telemetry-otel
# (entry id `session-telemetry-otel`) with a default OTLP exporter pointed at
# https://harness-telemetry.deepseeksvc.com/v1/logs. In docdrift that hook sits in the DeepSeek
# model-request path and surfaces as "DeepSeek request extension preparation failed" when the
# exporter stalls. Override here to disable it. The web profile does not carry this row either;
# this is the explicit profile-layer form of the same intent. To re-enable, remove this block
# or set `disabled: false`.
- id: session-telemetry-otel
  disabled: true

- id: plugin-package-inventory-deepseek
  config:
    enabled: false

# ── session-factory (AGENT TOOL) — SUPERSEDED 2026-10-09, commented out ────────────────────────────
#
# REPLACED BY THE `dsh-harness-rsi` BUNDLE, whose `session` row is this row's PORT and registers the
# SAME tool name (`session_create`), which is not namespaced. Both cannot mount. The original text is
# kept COMMENTED rather than deleted: it is the design record for a row that still exists on disk at
# ./session-factory/tool.js, and uncommenting it plus disabling the bundle's `session` row
# (`enabled: { session: false }`) is the narrow rollback for this row alone.
#
# ── ORIGINAL TEXT ─────────────────────────────────────────────────────────────────────────────────
# An agent-facing tool to create a ROOT session in a chosen workspace and optionally seed it with a
