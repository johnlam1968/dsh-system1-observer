# It calls two host methods and nothing else: `sessionController.create({cwd | workspaceId})` and,
# when a seed prompt is given, `sessionController.prompt({sessionId, content})`. The second matters:
# `prompt` resolves the agent — resuming a cold session and attaching its writer — BEFORE delivering,
# which is why seeding through it is safe. The failure that froze session logs was a delivery that
# happened before the writer was attached.
#
# The module lives in this directory because a `.`-prefixed row name resolves against the loader's
# baseUrl, which `dsh-app-boot` sets to the directory holding this profile's cordis.yml — and because
# `@deepseek-ai/dsh-tools` resolves from the profile rather than from ~/.dsh/plugins (the same reason
# peer-bridge lives here).
#
# INSERTED, not named: this layer is WATCHED (dsh-hmr reconciles the file live), so the row mounts
# without a restart. Delete this block and the directory to take the tool away again.
#
# Re-touched 2026-10-09 15:3x: the first import failed the defineTool guard (`parameters.cwd.required
# must be true when present` — optional parameters omit `required` entirely). Fixing the module file
# did not re-import it, because the watcher follows THIS file; editing it forces the reconcile.
