# ── dsh-misc-tools: arm the restart row for the docdrift profile (2026-10-09) ──────────────────
#
# The unit is dsh@docdrift.service (template unit, see /home/john/.config/systemd/user/dsh@.service).
# Its Restart=always policy means a request_restart call ends every session in this process and
# brings the unit back ~3 s after SIGTERM. The marker at $DSH_HOME/restart-pending.json is the
# post-boot proof — read it on the next turn to confirm a restart actually happened, and to
# distinguish a deliberate restart from a crash.
#
# Operator policy (2026-10-09, after the first end-to-end test passed): arm the row by default.
# Agents and humans may switch the model at will; this is the deployment's restart capability, kept
# on. Behaviour in code:
#   * `restartEnabled` is the kill switch. Flip to false here to disarm.
#   * `restartCommand` is the only command the row will ever run, deployment-supplied.
#   * `restartDelaySeconds` is the 2 s gap that lets the tool result reach the model before the
#     process it describes goes away. Lower bound is 1 s; do not set 0.
#   * `restartMarkerPath` left at the default ($DSH_HOME/restart-pending.json) — explicit enough.
#   * `restartWithoutMarker` left at the default (false) so an unconfirmable restart is refused.
#
# To disarm, set restartEnabled: false (or delete this block). The row's own inert defaults then
# take over: empty command, restartEnabled false, request_restart refuses with the codes the user
# already saw during the staged test.
- id: dsh-misc-tools
  config:
    restart:
      restartCommand: systemctl --user restart dsh@docdrift
      restartEnabled: true
      restartDelaySeconds: 2

    # ── nudge MOVED OUT (2026-10-10) ──────────────────────────────────────────────────────────────
    #
    # The nudge row used to live in this bundle. It was the only row here that registered NO tool --
    # the other six exist to put model-callable capabilities in front of the agent -- and it consumes
    # the `system1Observer` service, so it belongs with the plugins derived from the observer rather
    # than inside a tools bundle. It is now its own package, `dsh-system1-nudge`, listed in this
    # profile's bundles, and its settings moved to the row override below.
    #
    # `enabled.nudge: false` is what makes the move safe: the `nudge` SERVICE NAME is process-global,
    # so if both rows mounted, the second registration would fail loudly. The key is now unknown to
    # this package, which is harmless -- Schemastery passes undeclared keys through -- and it is kept
    # for one restart so a profile rolled back to the old dsh-misc-tools is still safe.
    enabled:
      nudge: false

# ── dsh-system1-nudge: the nudge row, as its own package (2026-10-10) ─────────────────────────────
#
# WHAT IT IS. It DETECTS a stuck session -- six signals read off the session log, plus an optional
# seventh from a mounted observer -- and, only when at least TWO fire together, delivers a message
# into that session's own inbox to keep it working; as a last resort it can move the session to
# another model. Its observables are the JSONL record below, the declared `nudge` service, and the
# `nudge_config` tool it now registers.
#
# WHAT CHANGED IN THE MOVE, beyond the address:
#   * it declares a real Schemastery `Config`, so THESE VALUES ARE NOW VALIDATED by the Loader before
#     the row is constructed. The old plugin root declared only `enabled` and `recordPath`; every
#     other key reached the row unchecked.
#   * it provides a declared SERVICE, so a consumer can `inject: ['nudge']` and get a lifecycle-
#     managed dependency instead of an opaque provided value.
#   * it registers ONE TOOL, `nudge_config`, which reads and writes these settings -- including
#     `authority` and `sessions`, i.e. an agent can widen its own grant. That is the operator's
#     decision, taken knowingly; the package README says so.
#   * it imports its tokenizer from `dsh-system1-observer` (which now exposes `./nudge-label`)
#     instead of carrying a copy. Its `recurrence` deliberately stays LOCAL: the observer's counts
#     word OCCURRENCES and can exceed 1, so importing it would move the `repeated_phrasing` threshold.
#
# WHY THESE VALUES. This is the state the row recommends arriving in: `authority: policy` with an
# EMPTY allowlist means it evaluates every session and RECORDS what it would have done, and acts on
# nothing. There is deliberately no "all sessions" mode -- authority is observe | self | policy, so
# acting is always a named grant.
#
# `escalation` is left EMPTY on purpose: with no target there is nothing to escalate to, which makes
# `maxEscalationsPerSession` moot. `confirmations` (2), `cooldownSeconds` (300) and
# `maxNudgesPerSession` (2) keep their defaults. `thresholds.minSignals` (2) is the number that stops
# Written by `packages/nudge/scripts/start-self-watch.mjs`. `authority: self` with
# `selfSessionId` set to the most recently active session from the record file, and
# `sessions: []` cleared (`self` gates on `selfSessionId`, not on `sessions`). The
# previous comment block described an earlier "overwrite the nudge config" change
# and is intentionally replaced; the script is the source of truth for this block.
- id: dsh-system1-nudge
  config:
    enabled: true
    authority: self
    selfSessionId: session-362b0f1f-3d5b-42e3-8989-39bf6087d358
    sessions: []
    thresholds:
      narrationMessages: 2
      narrationChars: 250
      repeatPhrasing: 0.5
      retries: 3
      toolErrorStreak: 3
      idleTurns: 2
      minSignals: 1
    confirmations: 1
    cooldownSeconds: 120
    maxNudgesPerSession: 5
    maxEscalationsPerSession: 1
    tokenBudget: 0
    escalation:
      provider: ""
      model: ""
      reasoningEffort: ""
    escalationVia: auto
    mode: auto
    sourceKind: nudge
    recordPath: /home/john/.dsh/nudge-record.jsonl
    observerLabel: true
    maxEventsPerSession: 400
    outcomeWindowTurns: 3

- id: relay
  config:
    bind: 0.0.0.0
    port: 3443
    stateDir: !!js dshHomePath('relay')
    tls: self-signed
    publicHostnames: []
    auth: both
    sessionTtlMs: 43200000
    deviceTokenTtlMs: 2592000000
    pairingWindowMs: 300000
    maxFailedAttempts: 5
    lockoutMs: 900000
    rateLimitPerMinute: 600
    privilegedMethods: allow-authenticated
    extraProxyPaths: []
    compat:
      addressGrants: false
      addressGrantTtlMs: 86400000
      plainPort: 0
    uiLink: true
    mdns: true
  disabled: true
